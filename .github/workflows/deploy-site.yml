# Concern: publishes website/ to GitHub Pages | Non-concern: the page's content (website/src/ owns it), the plugin release (plugin-release.yml) | IO: (a push touching website/) -> a Pages deployment
# The Pages source must be set to GitHub Actions, NOT a branch: a branch source can only publish the
# repo root or /docs, and the site lives in website/ so the root stays a Rust workspace.
# No generator is wired because the page needs none — it is one file with inline CSS and JS that
# makes no external request. When one is chosen, its build lands in "Stage the site" and nothing
# below that step changes.
name: deploy-site

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push waits rather than cancelling: a half-finished deploy would leave the live site on a
# mix of two commits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r website/src/. _site/
          # Static assets served as-is. Annotation sidecars are repo metadata, never content, so
          # they are dropped rather than published beside the page they describe.
          cp -r website/public/. _site/
          find _site -name '*.annotation' -delete
          # A deploy missing either of these still LOOKS like a working site: without index.html
          # Pages serves a directory listing, and without CNAME it silently drops the custom domain
          # and moves to *.github.io. Both are checked because neither failure announces itself.
          test -f _site/index.html
          test -f _site/CNAME
          # The landing page's one call to action; a rename here ships a green deploy whose install
          # command 404s.
          test -f _site/install-cli

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
