# Concern: turns a v* tag into Release assets and the npm packages built from them | Non-concern: picking which asset a machine needs | IO: (a v* tag) -> assets + npm packages
# Both front ends are fetched by asset name, so a Release is what makes FSA1 work on a machine with
# no Rust toolchain. Built with the toolchain pinned in rust-toolchain.toml.
name: plugin-release

on:
  push:
    tags: ["v*"]           # e.g. git tag v0.1.0 && git push --tags
  workflow_dispatch: {}    # or run manually from the Actions tab

permissions:
  contents: write          # needed to create/update the Release

jobs:
  # A tag whose surfaces disagree must produce no assets rather than wrong ones, so this runs first
  # and everything else waits on it. NO version is written at build time — `/plugin update` and an
  # npm reader both take the number from the repo, so a value injected here would never reach the
  # file they fetch. The bump is a commit, and this job is what proves it happened.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The workspace, the plugin manifest, the tag and every npm manifest state one version
        run: |
          set -uo pipefail
          # scripts/workspace-version.sh reads [workspace.package] out of the root Cargo.toml. It is
          # the ONE parser: ci.yml's built-binary assertion calls the same script, so the two gates
          # cannot come to mean different things about which number is the workspace's.
          workspace=$(bash scripts/workspace-version.sh)
          plugin=$(jq -r .version plugin/.claude-plugin/plugin.json)
          # workflow_dispatch has no tag to compare, so the two file values are held to each other
          # and the tag leg is skipped.
          tag=""
          case "${GITHUB_REF:-}" in refs/tags/*) tag="${GITHUB_REF_NAME#v}" ;; esac
          echo "workspace Cargo.toml : ${workspace:-<unset>}"
          echo "plugin.json          : ${plugin:-<unset>}"
          echo "tag                  : ${tag:-<none: not a tag build>}"
          ok=1
          [ -n "$workspace" ] && [ -n "$plugin" ] || ok=0
          [ "$workspace" = "$plugin" ] || ok=0
          [ -z "$tag" ] || [ "$tag" = "$workspace" ] || ok=0
          # Agreement between the three is worth nothing if a member crate stopped inheriting: the
          # workspace value would pass while the binary reported its own. What `--version` prints is
          # the point, so the members are held to the declaration too.
          strays=$(grep -L 'version\.workspace = true' Cargo.toml crates/*/Cargo.toml conformance/Cargo.toml \
                   | grep -v '^Cargo\.toml$' || true)
          if [ -n "$strays" ]; then
            echo "these do not inherit the workspace version:"
            echo "$strays"
            ok=0
          fi
          # The npm manifests state a version too, and each wrapper pins five optional dependencies
          # to it. Nothing rewrites them at publish time, so they are held HERE rather than only by
          # build-npm.mjs: that script runs in the `npm` job, which `needs: release`, and a pin left
          # behind would refuse only after the Release is public.
          manifests=$(find distribution/npm -name package.json | sort)
          [ -n "$manifests" ] || { echo "no npm manifests found under distribution/npm"; ok=0; }
          for m in $manifests; do
            bad=$(jq -r --arg v "$workspace" '
              [ select(.version != $v) | "version = \(.version // "<unset>")" ]
              + [ (.optionalDependencies // {}) | to_entries[] | select(.value != $v)
                  | "optionalDependencies.\(.key) = \(.value // "<unset>")" ]
              | .[]' "$m") || { echo "$m could not be read"; ok=0; continue; }
            [ -z "$bad" ] || { echo "$m disagrees with ${workspace:-<unset>}:"; echo "$bad"; ok=0; }
          done
          # The pin SET, not only the pins that happen to be there. Iterating optionalDependencies
          # checks the values of whatever it finds, so a wrapper with the block DELETED iterates zero
          # times and passes — and the tag then publishes a shim that resolves no binary on any
          # platform. One dropped key is worse: four platforms work and the fifth is unreachable.
          # The expected names are DERIVED from build-npm.mjs's MATRIX, the single source of truth
          # this repo already names for the platform packages, so this job carries no second list of
          # its own to drift. (build-npm.mjs holds the same set itself: it runs in the `npm` job,
          # which `needs: release`, so it would refuse only after the Release is public.)
          lines() { printf '%s\n' "$1" | sed '/^$/d'; }
          rows=$(grep -oE 'front: *"[a-z]+", *plat: *"[a-z0-9-]+"' distribution/npm/scripts/build-npm.mjs \
                 | sed -E 's/front: *"([a-z]+)", *plat: *"([a-z0-9-]+)"/\1 fsa1-\1-\2/') || true
          [ -n "$rows" ] || { echo "no MATRIX rows found in distribution/npm/scripts/build-npm.mjs"; ok=0; }
          for front in $(lines "$rows" | awk '{print $1}' | sort -u); do
            w="distribution/npm/$front/package.json"
            want=$(lines "$rows" | awk -v f="$front" '$1 == f {print $2}' | sort)
            have=$(jq -r '(.optionalDependencies // {}) | keys[]' "$w" | sort) || { echo "$w could not be read"; ok=0; continue; }
            miss=$(comm -23 <(lines "$want") <(lines "$have"))
            extra=$(comm -13 <(lines "$want") <(lines "$have"))
            [ -z "$miss" ] || { printf '%s does not pin these MATRIX platform packages:\n%s\n' "$w" "$miss"; ok=0; }
            [ -z "$extra" ] || { printf '%s pins these, which the MATRIX does not name:\n%s\n' "$w" "$extra"; ok=0; }
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::the versions above disagree; no assets will be built" >&2
            exit 1
          fi
          echo "one version: $workspace"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: fsa1-cli-linux-x86_64
            mcp_asset: fsa1-mcp-linux-x86_64
            ext: ""
          # Static: the npm channel ships these, and a sandbox whose glibc we never see cannot
          # disagree with a binary that carries no dynamic libc at all.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: fsa1-cli-linux-x86_64-musl
            mcp_asset: fsa1-mcp-linux-x86_64-musl
            ext: ""
          # linux-aarch64 covers Apple-silicon containers and ARM cloud sandboxes; without this
          # asset those hosts are left building from source.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: fsa1-cli-linux-aarch64
            mcp_asset: fsa1-mcp-linux-aarch64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: fsa1-cli-linux-aarch64-musl
            mcp_asset: fsa1-mcp-linux-aarch64-musl
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            asset: fsa1-cli-macos-aarch64
            mcp_asset: fsa1-mcp-macos-aarch64
            ext: ""
          # Intel macOS is CROSS-BUILT from the Apple-silicon runner: GitHub is retiring the Intel
          # ones, and a release that waits for a scarce runner is a release that does not go out.
          - os: macos-14
            target: x86_64-apple-darwin
            asset: fsa1-cli-macos-x86_64
            mcp_asset: fsa1-mcp-macos-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: fsa1-cli-windows-x86_64.exe
            mcp_asset: fsa1-mcp-windows-x86_64.exe
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs exactly the toolchain in rust-toolchain.toml (channel is honored by rustup).
      - name: Install Rust
        run: rustup show

      # Every asset names its target explicitly, so the one built on a different host than it runs
      # on is not a special case, and the output path is the same shape everywhere.
      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Both front ends ship: the npm job below packs `mcp_asset`, and website/public/install-cli
      # fetches `asset` for anyone who wants the command in their own shell.
      # fsa1-cli -> fsa1-verbs -> fsa1-html, whose build.rs embeds this bundle: without it every
      # target builds nothing and the tag ships no assets at all.
      - name: fetch the pinned Vega runtime
        run: bash scripts/fetch-vega.sh

      - name: Build both front ends (release)
        run: cargo build --release -p fsa1-cli -p fsa1-mcp --target ${{ matrix.target }}

      # Normalize the artifact name to the asset the Release publishes.
      - name: Stage artifact (unix)
        if: matrix.ext == ''
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/fsa1-cli" "out/${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/fsa1-mcp" "out/${{ matrix.mcp_asset }}"
          chmod +x "out/${{ matrix.asset }}" "out/${{ matrix.mcp_asset }}"
      - name: Stage artifact (windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fsa1-cli.exe" "out/${{ matrix.asset }}"
          Copy-Item "target/${{ matrix.target }}/release/fsa1-mcp.exe" "out/${{ matrix.mcp_asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  # npx is how a machine reaches either front end without a Rust toolchain: `npx -y fsa1-mcp` and
  # `npx -y fsa1-cli` each resolve the one binary for the machine from an npm cache that survives
  # sessions, so no first-run download sits in front of the MCP handshake or the command. Every
  # local MCP server published in the official plugin directory is reached the same way.
  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # REQUIRED: mints the short-lived OIDC token trusted publishing uses
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm >= 11.5.1 (OIDC trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: Download the published binaries
        run: |
          set -eux
          mkdir -p dist
          for a in fsa1-cli-linux-x86_64-musl fsa1-cli-linux-aarch64-musl \
                   fsa1-cli-macos-x86_64 fsa1-cli-macos-aarch64 fsa1-cli-windows-x86_64.exe \
                   fsa1-mcp-linux-x86_64-musl fsa1-mcp-linux-aarch64-musl \
                   fsa1-mcp-macos-x86_64 fsa1-mcp-macos-aarch64 fsa1-mcp-windows-x86_64.exe; do
            gh release download "${{ github.ref_name }}" -p "$a" -O "dist/$a" --clobber
          done
      # No NODE_AUTH_TOKEN: `npm publish` auto-detects the OIDC id-token. A platform package must
      # exist before the wrapper that names it as an optional dependency, and build-npm.mjs prints
      # its publish dirs in exactly that order — one step, because each `run:` is its own shell and
      # that stdout does not survive a step boundary.
      #
      # `set -x` because this job only ever runs against a real tag and cannot be rehearsed: the
      # trace is the whole post-mortem, and the directories come from a subprocess's stdout, so
      # they appear nowhere else in the log — the traced `npm publish <dir>` is where they show up.
      # The list lands in a FILE, not a pipe: a pipe would put the loop in a subshell that reads
      # stdin, so a future `npm publish` that drained it would publish only the first directory and
      # still exit 0, and a process substitution would hide a build-npm.mjs failure from `set -e`.
      - name: Check the versions, inject the binaries, and publish
        run: |
          set -euxo pipefail
          node distribution/npm/scripts/build-npm.mjs "${GITHUB_REF_NAME#v}" dist > publish-dirs.txt
          mapfile -t dirs < publish-dirs.txt
          for d in "${dirs[@]}"; do npm publish "$d"; done
