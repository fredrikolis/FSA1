# Concern: cross-builds fsa1-cli for every host it runs on and attaches them to a Release | Non-concern: picking which asset a machine needs | IO: (a v* tag) -> release assets
# The launcher downloads by asset name, so a Release is what makes the plugin work on a machine with
# no Rust toolchain. Built with the toolchain pinned in rust-toolchain.toml.
name: plugin-release

on:
  push:
    tags: ["v*"]           # e.g. git tag v0.1.0 && git push --tags
  workflow_dispatch: {}    # or run manually from the Actions tab

permissions:
  contents: write          # needed to create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: fsa1-cli-linux-x86_64
            mcp_asset: fsa1-mcp-linux-x86_64
            ext: ""
          # Static: the npm channel ships these, and a sandbox whose glibc we never see cannot
          # disagree with a binary that carries no dynamic libc at all.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: fsa1-cli-linux-x86_64-musl
            mcp_asset: fsa1-mcp-linux-x86_64-musl
            ext: ""
          # The launcher resolves linux-aarch64 too (Apple-silicon containers, ARM cloud sandboxes);
          # without this asset those hosts fall all the way through to building from source.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: fsa1-cli-linux-aarch64
            mcp_asset: fsa1-mcp-linux-aarch64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: fsa1-cli-linux-aarch64-musl
            mcp_asset: fsa1-mcp-linux-aarch64-musl
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            asset: fsa1-cli-macos-aarch64
            mcp_asset: fsa1-mcp-macos-aarch64
            ext: ""
          # Intel macOS is CROSS-BUILT from the Apple-silicon runner: GitHub is retiring the Intel
          # ones, and a release that waits for a scarce runner is a release that does not go out.
          - os: macos-14
            target: x86_64-apple-darwin
            asset: fsa1-cli-macos-x86_64
            mcp_asset: fsa1-mcp-macos-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: fsa1-cli-windows-x86_64.exe
            mcp_asset: fsa1-mcp-windows-x86_64.exe
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs exactly the toolchain in rust-toolchain.toml (channel is honored by rustup).
      - name: Install Rust
        run: rustup show

      # Every asset names its target explicitly, so the one built on a different host than it runs
      # on is not a special case, and the output path is the same shape everywhere.
      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Both front ends ship: the launcher fetches `mcp_asset`, and website/public/install-cli
      # fetches `asset` for anyone who wants the command in their own shell.
      # fsa1-cli -> fsa1-verbs -> fsa1-html, whose build.rs embeds this bundle: without it every
      # target builds nothing and the tag ships no assets at all.
      - name: fetch the pinned Vega runtime
        run: bash scripts/fetch-vega.sh

      - name: Build both front ends (release)
        run: cargo build --release -p fsa1-cli -p fsa1-mcp --target ${{ matrix.target }}

      # Normalize the artifact name to the asset the launcher expects.
      - name: Stage artifact (unix)
        if: matrix.ext == ''
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/fsa1-cli" "out/${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/fsa1-mcp" "out/${{ matrix.mcp_asset }}"
          chmod +x "out/${{ matrix.asset }}" "out/${{ matrix.mcp_asset }}"
      - name: Stage artifact (windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fsa1-cli.exe" "out/${{ matrix.asset }}"
          Copy-Item "target/${{ matrix.target }}/release/fsa1-mcp.exe" "out/${{ matrix.mcp_asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  # npx is how a Claude host reaches this server: `npx -y fsa1-mcp` resolves the one binary for the
  # machine from an npm cache that survives sessions, so no first-run download sits in front of the
  # MCP handshake. Every local MCP server published in the official plugin directory is reached the
  # same way.
  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # REQUIRED: mints the short-lived OIDC token trusted publishing uses
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm >= 11.5.1 (OIDC trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: Download the published binaries
        run: |
          set -eux
          mkdir -p dist
          for a in fsa1-mcp-linux-x86_64-musl fsa1-mcp-linux-aarch64-musl \
                   fsa1-mcp-macos-x86_64 fsa1-mcp-macos-aarch64 fsa1-mcp-windows-x86_64.exe; do
            gh release download "${{ github.ref_name }}" -p "$a" -O "dist/$a" --clobber
          done
      - name: Stamp the version and inject the binaries
        run: node distribution/npm/scripts/build-npm.mjs "${GITHUB_REF_NAME#v}" dist
      # No NODE_AUTH_TOKEN: `npm publish` auto-detects the OIDC id-token. A platform package must
      # exist before the wrapper that names it as an optional dependency.
      - name: Publish the platform packages, then the wrapper
        run: |
          set -eux
          for plat in linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64 windows-x64; do
            npm publish "./distribution/npm/platforms/${plat}"
          done
          npm publish ./distribution/npm
