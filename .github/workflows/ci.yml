# Concern: runs the per-commit gate on both OSes, plus the oracle, installer and version jobs | Non-concern: what a gate checks (.githooks/pre-commit) | IO: (a push) -> per-job verdicts
name: ci

# The mechanical commit gate (.githooks/pre-commit + commit-msg), plus the checks that need a clean
# machine: the two round-trip oracles, and that both installers still resolve what the release
# publishes. Pins below are DELIBERATE — keep them in sync with .githooks/pre-commit,
# rust-toolchain.toml, and .annotated-tree.toml; bump each together, on purpose.

on:
  push:
  pull_request:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The whole mechanical gate, `.githooks/pre-commit --full`, on both OS legs. Every name that
  # becomes a FILE now goes through RANGE_SEP,
  # every alias through write_name_alias, and an assertion names a REGION rather than a spelling --
  # but a POSIX host accepts `:` as a filename, so a green run here cannot prove any of that. Adding
  # windows-latest is what would, and it goes on its own commit so a red row is one line to undo.
  # fail-fast: false so one OS still reports the other.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # lfs: true is REQUIRED — the ingest test fixtures + oracle workbooks are Git LFS objects
      # (.xlsx/.ods); without smudging, cargo test would read pointer files and fail.
      - uses: actions/checkout@v4
        with:
          lfs: true
      # Pinned to rust-toolchain.toml's channel (NOT @stable): a floating stable is the very drift the
      # pin exists to prevent. Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The annotation stage falls back to `npx annotated-tree@<floor>` when no global install is
      # found, which is every runner, so the gate needs a Node on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The comment linter is a pinned git rev, so the gate BUILDS it; the cache makes that a
      # once-ever cost. The key is the rev READ OUT of the hook, never restated here — the hook owns
      # it, and a second copy free to drift is the one failure that stays green (a stale key restores
      # the wrong binary and the gate still passes). Bumping the rev misses the cache once, on purpose.
      - id: linter-rev
        run: echo "rev=$(sed -n 's/^COMMENT_LINTER_REV=//p' .githooks/pre-commit)" >> "$GITHUB_OUTPUT"
      - name: cache the pinned comment linter
        uses: actions/cache@v4
        with:
          path: target/lint-tools
          # Keyed on the PINNED rev read out of the hook, never on the hook's bytes: the hook is now
          # every gate, so hashing it would rebuild the linter (minutes, both legs) on any gate edit.
          key: lint-tools-${{ runner.os }}-${{ steps.linter-rev.outputs.rev }}
      - name: fetch the pinned Vega runtime
        run: bash scripts/fetch-vega.sh

      # What `--version` PRINTS is the point, and nothing ran the binary: v0.2.3 shipped a fsa1-cli
      # reporting 0.1.0 while every declaration agreed on 0.2.3. It lands here rather than in
      # plugin-release.yml because it needs no tag — drift fails the push that causes it, not the
      # tag that ships it — and this job already holds a toolchain and a built workspace. Built
      # BEFORE the gate so the gate's `site` stage reuses the binary instead of building a second one.
      - name: Build both front ends
        run: cargo build --locked -p fsa1-cli -p fsa1-mcp

      # THE gate, the same file a developer's commit runs: fmt, clippy, the comment budget, the
      # annotation charter, the site re-render, and under --full the unfiltered workspace test run
      # (--include-ignored, so an #[ignore] never silently skips a load-bearing test). One definition,
      # so a gate cannot mean one thing locally and another here.
      - name: mechanical gates (.githooks/pre-commit --full)
        env:
          FSA1_CLI: ${{ github.workspace }}/target/debug/fsa1-cli
        run: bash .githooks/pre-commit --full

      - name: Both built front ends report the workspace version
        # `want` MUST come from the workspace manifest — [workspace.package] in the root Cargo.toml,
        # the declaration a bump edits — and never from a resolved PACKAGE version. `cargo metadata`
        # / `cargo pkgid` report for fsa1-cli the same number env!("CARGO_PKG_VERSION") compiled into
        # the binary being tested, so `cli == want` would hold by construction: it would still pass
        # with both front-end crates carrying `version = "0.1.0"` while the workspace says 0.3.0,
        # which is precisely how v0.2.3 shipped a fsa1-cli reporting 0.1.0.
        # scripts/workspace-version.sh is the ONE parser, shared with plugin-release.yml's `versions`
        # job, so there is no hand-kept duplicate free to drift.
        # fsa1-cli prints a JSON envelope, so `.data.version` is READ — a grep for the bare number
        # would pass on a build that printed it anywhere, a timestamp included. fsa1-mcp prints the
        # bare number.
        run: |
          set -uo pipefail
          want=$(bash scripts/workspace-version.sh)
          cli=$(./target/debug/fsa1-cli --version | jq -r .data.version)
          mcp=$(./target/debug/fsa1-mcp --version)
          echo "workspace Cargo.toml : ${want:-<unset>}"
          echo "fsa1-cli --version   : ${cli:-<unset>}"
          echo "fsa1-mcp --version   : ${mcp:-<unset>}"
          ok=1
          [ -n "$want" ] && [ -n "$cli" ] && [ -n "$mcp" ] || ok=0
          [ "$cli" = "$want" ] || ok=0
          [ "$mcp" = "$want" ] || ok=0
          if [ "$ok" -ne 1 ]; then
            echo "::error::a built front end does not report the workspace version" >&2
            exit 1
          fi
          echo "both front ends report: $want"

  # FSA1-specific mechanical gates — OS-independent, so once on ubuntu. No cargo toolchain needed
  # (bash only).
  gates:
    runs-on: ubuntu-latest
    steps:
      # lfs: true is REQUIRED — the serde round-trip corpus (accept/ + refuse/ .xlsx) are Git LFS
      # objects, and the steps below run from a full checkout.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: installers resolve the asset names plugin-release publishes
        # Exercises only the release-download branch: FSA1_VERSION and the wget path are not covered.
        run: |
          set -uo pipefail
          rc=0
          pub=$(grep -oE '(mcp_)?asset: +fsa1-(cli|mcp)-[a-z0-9_.-]+' .github/workflows/plugin-release.yml \
            | awk '{print $2}' | sort -u)
          [ -n "$pub" ] || { echo "no 'asset:' names found in plugin-release.yml"; exit 1; }
          W=$(mktemp -d); mkdir -p "$W/b" "$W/plug" "$W/dest"
          printf '#!/bin/sh\ncase $1 in -s) echo $S;; -m) echo $M;; esac\n' > "$W/b/uname"
          printf '#!/bin/sh\nfor a; do case $a in https://*) echo "$a">>"$U";; esac; done; exit 22\n' > "$W/b/curl"
          chmod +x "$W/b"/*
          got() { :>"$W/u"; env -i PATH="$W/b:/usr/bin:/bin" HOME="$W/plug" S=$2 M=$3 U="$W/u" \
            CLAUDE_PLUGIN_ROOT="$W/plug" CLAUDE_PLUGIN_DATA="$W/plug" FSA1_INSTALL_DIR="$W/dest" \
            "./$1" >/dev/null 2>&1; echo $? >"$W/e"; sed -n 's|.*/||p' "$W/u" | head -1; }
          # install-cli is proved against the family it actually fetches — the fsa1-cli assets, the
          # command a user runs in their own shell.
          printf '%s\n' "linux-x86_64 Linux x86_64" "linux-aarch64 Linux aarch64" \
            "macos-x86_64 Darwin x86_64" "macos-aarch64 Darwin arm64" \
            "windows-x86_64.exe MINGW64_NT-10.0 x86_64" > "$W/t"
          # TWO consumers, not one, and they do not want the same builds: install-cli resolves the
          # native fsa1-cli by uname, while the npm channel takes the STATIC musl build of BOTH front
          # ends on Linux so no glibc has to agree with a sandbox we never see. Asserting one set
          # equals the published list is what a second consumer falsifies, so each is held to the
          # list SEPARATELY.
          cli=$(awk '{print "fsa1-cli-" $1}' "$W/t" | sort -u)
          # build-npm.mjs's MATRIX is the code that CONSUMES these files and says of itself that it is
          # the single source of truth; the release workflow's download loop is a second hand-kept
          # copy. Read the authority, then hold the copy to it — a copy that drifts fails the npm job
          # AFTER the Release is public, which is the worst place to learn of it.
          # `|| true` on each assignment: errexit would kill the script before its own guard prints.
          npm=$(grep -oE 'asset: *"fsa1-(cli|mcp)-[a-z0-9_.-]+"' distribution/npm/scripts/build-npm.mjs \
            | cut -d'"' -f2 | sort -u) || true
          [ -n "$npm" ] || { echo "no asset names found in build-npm.mjs MATRIX"; rc=1; }
          fetched=$(sed -n '/Download the published binaries/,/^      - name:/p' \
            .github/workflows/plugin-release.yml | grep -oE 'fsa1-(cli|mcp)-[a-z0-9_.-]+' | sort -u) || true
          [ "$npm" = "$fetched" ] || { printf 'build-npm.mjs MATRIX and the release download loop name different assets:\nMATRIX:\n%s\ndownload loop:\n%s\n' "$npm" "$fetched"; rc=1; }
          resolved=$(printf '%s\n%s\n' "$cli" "$npm" | sort -u)
          miss=$(comm -23 <(printf '%s\n' "$resolved") <(printf '%s\n' "$pub"))
          [ -z "$miss" ] || { printf 'an installer fetches these and no job publishes them:\n%s\n' "$miss"; rc=1; }
          # Not a failure: a build nobody fetches costs a runner, not a broken install.
          orphan=$(comm -13 <(printf '%s\n' "$resolved") <(printf '%s\n' "$pub"))
          [ -z "$orphan" ] || printf 'note: published, fetched by neither installer:\n%s\n' "$orphan"
          while read -r slug s m; do
            for pair in "website/public/install-cli:fsa1-cli"; do
              f=${pair%%:*}; want="${pair#*:}-$slug"
              r=$(got "$f" "$s" "$m")
              [ "$r" = "$want" ] || { echo "$f ($s $m) -> ${r:-nothing}, published $want"; rc=1; }
            done
          done < "$W/t"
          for f in website/public/install-cli; do
            r=$(got "$f" SunOS sparc64)
            [ -z "$r" ] && [ "$(cat "$W/e")" != 0 ] \
              || { echo "$f on SunOS/sparc64 -> '${r:-no download}' exit $(cat "$W/e"), want a refusal"; rc=1; }
          done
          exit $rc

  # SER2 round-trip oracle: the "opens-identically" fitness (plan 06 §7.3). Ubuntu-only — the `formulas`
  # reference stack is platform-independent, and (like conformance/xl-oracle) it needs only a pinned
  # Python venv, NO LibreOffice / apt install. run.sh builds fsa1-cli, provisions the .venv from the
  # pinned requirements.txt (network for the one-time pip install), and drives roundtrip_oracle.py,
  # forwarding its exit code. This job is SER2's THIRD-PARTY half, the half FSA1 cannot grade for itself:
  # openpyxl and `formulas` must both reopen the export, `formulas` must recompute it to the source's own
  # values, and the independent numfmt_render.py must render each formatted cell to the same display
  # string under the export's code as under the source's. fsa1-cli/tests/roundtrip.rs runs in the matrix
  # `test` job on every OS and owns the other half: SER3's refusals, and SER2 through FSA1's own reader,
  # comparing the value, formula source, display-format code and resolved CellStyle a re-unpack of the
  # export presents at every coordinate. That test compares no file tree — docs/cli-spec.md withdrew SER4
  # (re-import idempotence) into SER2, and since `pack` writes one <cellXfs> entry per look, the blocks a
  # re-unpack cuts are the decomposition's business rather than the contract's.
  serde-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch the pinned Vega runtime
        run: bash scripts/fetch-vega.sh
      - name: SER2 round-trip oracle (formulas + openpyxl)
        run: conformance/serde/run.sh

  # Presentation round-trip oracle: the "does not come out visually blank" fitness (plan 01 §12).
  # Ubuntu-only and venv-only for the same reasons as serde-roundtrip above. run.sh builds fsa1-cli,
  # provisions the .venv from the pinned requirements.txt (network for the one-time pip install), and
  # drives presentation_oracle.py, forwarding its exit code. This job is the leg where a THIRD-PARTY
  # reader (openpyxl) reopens the packed export and says whether the source's own look is on it; the
  # frozen-stylesheet and `check`-accepts assertions (conformance/tests/presentation_scope.rs) run in the
  # matrix `test` job on every OS, with no venv and no network.
  presentation-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch the pinned Vega runtime
        run: bash scripts/fetch-vega.sh
      - name: presentation round-trip oracle (openpyxl)
        run: conformance/presentation/run.sh
