name: build

# Mirrors the mechanical commit gate: fmt + clippy (the fast checks the pre-commit hook runs) PLUS
# the full test gate the hook deliberately leaves out (`cargo test --workspace -- --include-ignored`).
# --include-ignored is mandatory so an `#[ignore]` never silently skips a load-bearing test.
#
# cargo runs use `--locked`: a committed Cargo.lock must be authoritative, so CI FAILS on lockfile
# drift instead of silently updating it. The final step runs the commit gate's OWN regression
# selftests (pure bash, no cargo) — without a mechanical entrypoint they would silently rot, and a
# future edit to a hook parser could break a locked quirk with nothing to catch it.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact channel in rust-toolchain.toml (not @stable): rustup's directory override
      # would make cargo run 1.96.0 regardless, but installing @stable is misleading (a reader expects
      # floating stable, the very drift the pin exists to prevent) and pulls an unused toolchain. Keep
      # this in sync with rust-toolchain.toml; bump both together, deliberately.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: fmt --check
        run: cargo fmt --all -- --check
      - name: clippy -D warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: oracle-input purity (frozen corpus fingerprint)
        # The frozen encoding corpus is a graded ORACLE INPUT: charlie-model is graded AGAINST these
        # fixtures (the render zero-divergence gate in charlie-model/tests/render_conformance.rs grades
        # the 6 valid workbooks; the EXPECTED ledgers document the invalid/edge verdicts) and must
        # never author/edit/regenerate them (conformance/encoding/PROVENANCE.md). Re-hash every corpus
        # file against the manifest so a silent fixture or EXPECTED-ledger rewrite fails CI here — this
        # is the mechanical enforcement of "oracle-input purity".
        # Kept out of the crypto-free charlie-model (system sha256sum, per PROVENANCE.md), so it lives
        # here rather than in a Rust test. Paths in the manifest are relative to the corpus root.
        working-directory: conformance/encoding
        run: sha256sum -c MANIFEST.sha256 --quiet
      - name: test (--include-ignored)
        # This is an UNFILTERED workspace run, so the "zero-tests-ran guard" from docs/commit-gate.md
        # (assert `test result: ok. [1-9][0-9]* passed` because `cargo test <filter>` exits 0 when a
        # filter matches nothing) is not needed here — there is no filter to drift. If any CI step
        # ever narrows to `cargo test <filter>`, add that guard so filter drift cannot green-light.
        run: cargo test --locked --workspace -- --include-ignored
      - name: commit-gate selftests
        # The gate's own regression tables — pure bash, no cargo. This is their ONLY mechanical
        # entrypoint (no root run-tests.sh / Makefile), so it is what keeps the locked parser
        # quirks from silently rotting. Both must stay green. Run: bash .githooks/<name>.selftest.sh
        run: |
          bash .githooks/pre-commit.selftest.sh
          bash .githooks/commit-msg.selftest.sh
