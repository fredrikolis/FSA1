name: annotations

# Enforce the suite-wide first-line annotation convention + the architectural rules in
# .annotated-tree.toml (require_package_charter, forbid_cycles; the North-Star deny edges +
# forbid_orphans arrive as crates land). Mirrors .githooks/pre-commit. Three frozen conformance
# corpora are graduated CONTRACTS, not authored source, so each is excluded:
# `-I 'conformance/encoding/**'` (the W1 encoding corpus), `-I 'conformance/formula/**'` (the W3
# formula-conformance corpus), and `-I 'conformance/render/**'` (the W4 rendered-VALUE oracles) —
# keep these globs in sync with the hook and the .annotated-tree.toml note (annotated-tree's config
# has no `ignore` key, so exclusion is done at the CALL site).
#
# annotated-tree is PINNED to an exact version (`annotated-tree@0.2.1`) — this gate is load-bearing,
# so a floating `npx --yes annotated-tree` (latest) could change --strict-check behavior and either
# break or silently weaken the gate, and CI could disagree with a local install. Keep this version
# in sync with the `.githooks/pre-commit` fallback. Bump both together, deliberately.

on:
  push:
  pull_request:

jobs:
  annotated-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enforce annotations + architecture rules
        # Pinned version — keep in sync with the .githooks/pre-commit fallback.
        run: npx --yes annotated-tree@0.2.1 --strict-check --include-tests -I 'conformance/encoding/**' -I 'conformance/formula/**' -I 'conformance/render/**' .
