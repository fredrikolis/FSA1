# Concern: declares the package, its binary target and the crates the CLI composes | Non-concern: the deny edges barring anything from depending on it (.annotated-tree.toml) | IO: none
[package]
name = "fsa1-cli"
version.workspace = true
edition = "2024"
license.workspace = true

[[bin]]
name = "fsa1-cli"
path = "src/main.rs"

[dependencies]
fsa1-verbs = { path = "../fsa1-verbs" }
fsa1-model = { path = "../fsa1-model" }
fsa1-ingest = { path = "../fsa1-ingest" }

[dev-dependencies]
calamine = "0.36"
unicode-width = "0.2.2"
