# Concern: declares the package and its deps, the READ-side format libraries included | Non-concern: what the crate does, the write half (fsa1-xlsx) | IO: none
[package]
name = "fsa1-ingest"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
fsa1-ast = { path = "../fsa1-ast" }
fsa1-model = { path = "../fsa1-model" }
calamine = "0.36"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
