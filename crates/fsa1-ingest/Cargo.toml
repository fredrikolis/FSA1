# Concern: declares the package and its deps: calamine, serde_json, and the fsa1-xlsx crate that spells the format | Non-concern: what the crate does, the deny edges (.annotated-tree.toml) | IO: none
[package]
name = "fsa1-ingest"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
fsa1-ast = { path = "../fsa1-ast" }
fsa1-model = { path = "../fsa1-model" }
# How an .xlsx is spelled has ONE home, and it is not here: this crate drives the import PIPELINE and
# asks fsa1-xlsx for every byte layout, in either direction. Owner-blessed edge, 2026-08-07.
fsa1-xlsx = { path = "../fsa1-xlsx" }
calamine = "0.36"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# Only tests/import_fidelity.rs reaches these: it PATCHES a package's parts to author a fixture the
# importer then reads. Reading one for real is fsa1-xlsx's job.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
