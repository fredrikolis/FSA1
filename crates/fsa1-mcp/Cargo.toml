# Concern: declares the MCP server package and the crates it composes | Non-concern: the deny edges barring anything from depending on it (.annotated-tree.toml) | IO: none
[package]
name = "fsa1-mcp"
version = "0.2.3"
edition = "2024"
license.workspace = true

[[bin]]
name = "fsa1-mcp"
path = "src/main.rs"

[dependencies]
fsa1-verbs = { path = "../fsa1-verbs" }
fsa1-model = { path = "../fsa1-model" }
fsa1-ingest = { path = "../fsa1-ingest" }
serde_json = "1"
