# The THIN CLI shell (W4). `charlie-cli` is the binary surface — `render`/`check`/`eval`/`sample`/
# `import` — and holds NO spreadsheet logic: it parses argv, asks `charlie-model` for a plain-data
# render grid / lint report / eval value (or `charlie-ingest` to CONVERT an `.ods` into a workbook),
# and lays the outcome out with `comfy-table` (the presentation layer). The firewall direction is
# `cli -> {model, ingest} -> ast` (docs/architecture.md §1): it depends on `charlie-model` (which
# re-exports the `charlie-ast` types it needs) and on `charlie-ingest` for `import`; the core never
# depends back — enforced by the `["charlie-ast","charlie-cli"]`, `["charlie-model","charlie-cli"]`,
# and `["charlie-ingest","charlie-cli"]` deny edges in ../.annotated-tree.toml. `comfy-table` is the
# only third-party dep, pinned; all conversion/model logic stays in the library crates.
[package]
name = "charlie-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "charlie-cli"
path = "src/main.rs"

[dependencies]
charlie-model = { path = "../charlie-model" }
charlie-ingest = { path = "../charlie-ingest" }
comfy-table = "7.2"
