# The INGEST crate (spreadsheet deserializer, ODS first). It is the FORMAT FIREWALL: `calamine`
# (and its transitive `zip`/`quick-xml`) live HERE and nowhere else — charlie-model and charlie-ast
# stay calamine-free so the engine keeps reading TSV grids (HARD RULE 4, docs/architecture.md). The
# allowed edges are `charlie-ingest -> {charlie-model, charlie-ast}` (it reuses the shared value/A1
# types and writes the on-disk model); nothing depends back on it except the CLI (`cli -> ingest`),
# enforced by the deny edges in ../.annotated-tree.toml.
[package]
name = "charlie-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
charlie-ast = { path = "../charlie-ast" }
charlie-model = { path = "../charlie-model" }
calamine = "0.36"
# The xlsx metadata reader (`xlsx_meta.rs`) reads the definedNames + table parts (`xl/tables/*.xml`)
# that calamine's high-level `Reader` seam does not surface (name scoping, table header/totals extent).
# `zip`/`quick-xml` are part of the format firewall (HARD RULE 4): they live in charlie-ingest ONLY,
# alongside calamine, so charlie-model/charlie-ast stay A1-only. Versions match calamine's transitive
# pins so no new resolution is introduced.
# Minimal zip surface (deflate/stored — what an xlsx uses); no extra compression backends beyond what
# calamine already pulls, so the lockfile does not grow.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
