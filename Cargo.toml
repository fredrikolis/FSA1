# Workspace root. Build-out: two product crates have landed — `charlie-ast` (the formula-language
# contract surface, W0) and `charlie-model` (the filesystem spreadsheet model, W2), with the
# `charlie-model -> charlie-ast` firewall edge now real, so `.annotated-tree.toml` re-enables
# `forbid_orphans` and adds the `["charlie-ast","charlie-model"]` deny edge. charlie-cli/charlie-xlsx
# follow (their deny edges land only once those crates exist — docs/architecture.md §1, §5).
[workspace]
resolver = "2"
members = ["charlie-ast", "charlie-model", "conformance"]
