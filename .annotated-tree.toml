# annotated-tree enforcement config for the charlie workspace.
#
# The per-file first-line annotation convention (`Concern | Non-concern | IO`, space-pipe-space)
# is INVARIANT and lives at the annotated-tree project page — it is NOT configured here. This file
# owns only the repo-wide ARCHITECTURAL rules the gate enforces. Valid tables: display, limits,
# rules, languages (there is NO ignore key — corpus/fixture exclusion is done at the CALL site with
# `-I` globs in .githooks/pre-commit and .github/workflows/annotations.yml; keep them in sync).
#
# ACTIVE EXCLUSION GLOBS (kept in sync across both call sites — the hook + annotations.yml):
#   -I 'conformance/encoding/**'
#   -I 'conformance/formula/**'
#   -I 'conformance/render/**'
# Three frozen conformance corpora are SANCTIONED graduated contracts, not authored source:
#   - conformance/encoding/ (W1, see its PROVENANCE.md): `.range`/`.cell` sheet files + `.md` ledgers.
#   - conformance/formula/  (W3, see its PROVENANCE.md): the `.fixtures` value probes, PROVENANCE.md,
#     MANIFEST.sha256, and the charlie-DERIVED facts-snapshot.tsv anchor.
#   - conformance/render/   (W4, see its PROVENANCE.md): the migrated rendered-VALUE oracles under
#     oracle/** (`.json`/`.csv` + each `compute_oracle.py` + per-category `.md`), PROVENANCE.md,
#     MANIFEST.sha256, and the charlie-DERIVED facts-snapshot.tsv anchor.
# Their data files carry no recognized code extension (already invisible to the linter), but their
# `.md`/`.py` ledgers ARE governed by the annotation gate — a frozen contract must not be, so each
# corpus is excluded at the call site. The GRADERS are NOT excluded and stay annotated: charlie-model's
# tests/{encoding,render}_conformance.rs and the whole `conformance` crate (its src/**/ + tests/**/
# are authored code that must carry annotations).

[rules]
# Every crate with a Cargo.toml must resolve a concern CHARTER (an annotation on src/lib.rs /
# src/main.rs, or a .annotation breadcrumb) so each crate's one job is legible at the tree level.
require_package_charter = true

# The internal crate dependency graph stays a DAG with no isolated crates.
forbid_cycles = true
# forbid_orphans is ON now that charlie-model has landed: the `charlie-model -> charlie-ast` edge
# makes an isolated crate a real signal (W0 kept this OFF only because a lone crate is trivially an
# "orphan" that could not be fixed until a second crate existed — docs/architecture.md §5).
forbid_orphans = true

# ARCHITECTURAL FIREWALL (populated as crates land — docs/architecture.md §1, §5 W2+).
# NOTE: a deny pair naming a crate that does not yet exist is a FATAL `unknown_deny_package`
# violation, so each edge is added only once BOTH its crates exist. With charlie-ast + charlie-model +
# charlie-cli present (W4), the three now-valid edges are wired below; the xlsx pair lands with it.
#   ["charlie-ast",   "charlie-model"]  # WIRED: the formula engine must never know the filesystem model
#   ["charlie-ast",   "charlie-cli"]    # WIRED: the engine never depends on the binary
#   ["charlie-model", "charlie-cli"]    # WIRED: the model never depends on the binary
#   ["charlie-ast",   "charlie-xlsx"]   # pending charlie-xlsx: the core never knows xlsx
#   ["charlie-model", "charlie-xlsx"]   # pending charlie-xlsx: the core never knows xlsx
# The direction that IS allowed: cli -> model -> ast, and xlsx -> {ast, model}. This encodes the
# owner's hard rule that the AST impl is swappable behind a narrow boundary.
deny = [
    ["charlie-ast", "charlie-model"],
    ["charlie-ast", "charlie-cli"],
    ["charlie-model", "charlie-cli"],
]
