# annotated-tree enforcement config for the charlie workspace.
#
# The per-file first-line annotation convention (`Concern | Non-concern | IO`, space-pipe-space)
# is INVARIANT and lives at the annotated-tree project page — it is NOT configured here. This file
# owns only the repo-wide ARCHITECTURAL rules the gate enforces. Valid tables: display, limits,
# rules, languages (there is NO ignore key — corpus/fixture exclusion is done at the CALL site with
# `-I` globs in .githooks/pre-commit and .github/workflows/annotations.yml; keep them in sync).

[rules]
# Every crate with a Cargo.toml must resolve a concern CHARTER (an annotation on src/lib.rs /
# src/main.rs, or a .annotation breadcrumb) so each crate's one job is legible at the tree level.
require_package_charter = true

# The internal crate dependency graph stays a DAG with no isolated crates.
forbid_cycles = true
# forbid_orphans is OFF while the workspace holds a SINGLE crate: a lone crate has no internal
# edges in or out and is therefore trivially an "orphan", which would fail the gate for a reason
# that cannot be fixed until a second crate exists. Re-enable it the moment charlie-model lands
# (docs/architecture.md §5, W1) and the first `cli -> model -> ast` edge makes orphans a real signal.
forbid_orphans = false

# ARCHITECTURAL FIREWALL (populated as crates land — docs/architecture.md §1, §5 W2+).
# NOTE: a deny pair naming a crate that does not yet exist is a FATAL `unknown_deny_package`
# violation, so these are added only once both crates exist. The intended invariants:
#   ["charlie-ast",   "charlie-model"]  # the formula engine must never know the filesystem model
#   ["charlie-ast",   "charlie-cli"]    # the engine never depends on the binary
#   ["charlie-model", "charlie-cli"]    # the model never depends on the binary
#   ["charlie-ast",   "charlie-xlsx"]   # the core never knows xlsx
#   ["charlie-model", "charlie-xlsx"]   # the core never knows xlsx
# The direction that IS allowed: cli -> model -> ast, and xlsx -> {ast, model}. This encodes the
# owner's hard rule that the AST impl is swappable behind a narrow boundary.
deny = []
